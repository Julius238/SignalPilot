# Build, Lint und alle Workspace-Tests bei jedem Push und Pull Request.
#
# Sicherheitsgrenzen:
# - Keine Secrets, keine Zugangsdaten. Die Test-Datenbank ist ein flüchtiger
#   Service-Container ohne Passwort, nur vom Runner aus erreichbar.
# - Es startet kein Worker, kein Scheduler und kein Trading-Prozess; nur
#   Build-Skripte und Tests laufen. Kein Deployment, keine produktive Datenbank.
# - Leserechte am Repository genügen.
#
# Ablauf und lokale Entsprechung: docs/TESTING.md
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Lint & Test
    runs-on: ubuntu-24.04
    # Der Job braucht knapp 8 min, davon 5 min Tests (2026-10-16, ohne den
    # Evolution-Worker). Langsame Läufer brauchten bisher bis zu doppelt so
    # lange; 30 min lassen Luft, ohne einen hängenden Job endlos laufen zu lassen.
    timeout-minutes: 30

    services:
      postgres:
        # Gleiche Major-Version wie docker-compose.prod.yml.
        image: postgres:16-alpine
        env:
          POSTGRES_DB: signalpilot_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d signalpilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/signalpilot_test?schema=public
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      NEXT_TELEMETRY_DISABLED: "1"
      # Dashboard-Build wie im Produktions-Image; das Trading-Dashboard bleibt aus.
      NEXT_PUBLIC_SIGNALPILOT_API_URL: /api
      SIGNALPILOT_API_INTERNAL_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_TRADING_DASHBOARD_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          # Sonst sucht setup-node wegen `packageManager` schon hier nach pnpm,
          # das erst im nächsten Schritt über Corepack bereitsteht.
          package-manager-cache: false

      # pnpm kommt über Corepack aus `packageManager` (pnpm@9.15.0). Das füllt
      # zugleich den Corepack-Cache, den der Offline-Test des Shims
      # (apps/dashboard/test/local-setup.test.ts) voraussetzt.
      - name: pnpm via Corepack
        run: |
          corepack enable
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations to the test database
        run: pnpm db:migrate:deploy

      # Pakete, dann Apps. Die API-Tests importieren den gebauten Trading-Worker.
      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Operations script checks
        run: pnpm ops:test:scripts

      # --no-bail: alle Pakete laufen, auch wenn eines fehlschlägt. Die Ausgabe
      # geht zusätzlich in eine Datei für die Zusammenfassung pro Paket.
      # --no-sort: Gebaut ist schon, die Tests brauchen keine topologische
      # Reihenfolge. Sortiert startet pnpm jede Abhängigkeitsstufe erst nach
      # dem Ende der vorigen; ohne Sortierung laufen alle Pakete in einer
      # Stufe (je 4 gleichzeitig, nach Pfad). Der Evolution-Worker läuft im
      # eigenen Job unten.
      - name: Test
        shell: bash
        run: pnpm -r --no-sort --no-bail --if-present --filter '!@signalpilot/evolution-worker' test 2>&1 | tee "$RUNNER_TEMP/test-output.log"

      # Tabelle pro Paket im Log und auf der Run-Seite (Job Summary).
      - name: Test summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          [ -f "$RUNNER_TEMP/test-output.log" ] || exit 0
          scripts/ci/test-summary.sh "$RUNNER_TEMP/test-output.log" | tee -a "$GITHUB_STEP_SUMMARY"

  # Die längste Suite (Forschungszyklen mit Replays, nacheinander wegen der
  # gemeinsamen Evolution*-Tabellen) auf einem eigenen Läufer. Im Hauptjob
  # teilte sie sich 4 vCPU mit allen anderen Paketen; der Testschritt brauchte
  # so 14 min, lokal braucht die Suite allein rund 4 min. Eigene Datenbank,
  # gleiche Sicherheitsgrenzen.
  evolution-worker-test:
    name: Evolution worker tests
    runs-on: ubuntu-24.04
    # Gut 6 min, davon 5 min Tests (2026-10-16).
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: signalpilot_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d signalpilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/signalpilot_test?schema=public
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: pnpm via Corepack
        run: |
          corepack enable
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations to the test database
        run: pnpm db:migrate:deploy

      # Nur der Worker und seine Abhängigkeiten (Suffix `...`, wie im Dockerfile);
      # der Hauptjob baut und lintet alles.
      - name: Build
        run: pnpm --filter "@signalpilot/evolution-worker..." build

      # --stream: mit Paket-Präfix wie im Hauptjob, sonst findet die
      # Zusammenfassung bei nur einem Paket keine Zeilen.
      - name: Test
        shell: bash
        run: pnpm -r --stream --filter @signalpilot/evolution-worker test 2>&1 | tee "$RUNNER_TEMP/test-output.log"

      - name: Test summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          [ -f "$RUNNER_TEMP/test-output.log" ] || exit 0
          scripts/ci/test-summary.sh "$RUNNER_TEMP/test-output.log" | tee -a "$GITHUB_STEP_SUMMARY"
