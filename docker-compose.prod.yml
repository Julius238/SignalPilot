services:
  # ── Infrastructure ─────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Credentials come entirely from .env.production (POSTGRES_USER, POSTGRES_PASSWORD,
    # POSTGRES_DB). Using env_file — not ${VAR} interpolation — ensures the postgres
    # container always sees the same password as DATABASE_URL.
    env_file:
      - path: .env.production
        required: false
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # $$VAR expands inside the container shell, not at Compose parse time.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - internal
    # Postgres is NOT exposed externally; connect via docker exec or tunnel

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── Application ────────────────────────────────────────────────────────────

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    environment:
      NODE_ENV: production
      PORT: "3100"
      HOST: "0.0.0.0"
    ports:
      # Bind to loopback only — put a reverse proxy in front for public access
      - "127.0.0.1:3100:3100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - internal

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      target: runtime
      # Build args, not runtime env: Next.js inlines NEXT_PUBLIC_* into the
      # client bundle when the image is built. Each one is forwarded
      # explicitly with a safe default, so an unset variable produces the
      # conservative build rather than an empty string. Only browser-safe
      # values belong here — never a secret (docs/DEPLOYMENT.md).
      args:
        NEXT_PUBLIC_SIGNALPILOT_API_URL: ${NEXT_PUBLIC_SIGNALPILOT_API_URL:-/api}
        SIGNALPILOT_API_INTERNAL_URL: ${SIGNALPILOT_API_INTERNAL_URL:-http://api:3100}
        NEXT_PUBLIC_TRADING_DASHBOARD_ENABLED: ${NEXT_PUBLIC_TRADING_DASHBOARD_ENABLED:-false}
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 statt localhost: localhost löst im Container auch auf ::1 auf, wo
      # Next nicht lauscht. /login ist der einzige stabil mit 200 antwortende Pfad —
      # "/" leitet je nach Session auf /login oder /dashboard um.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/login >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - internal

  worker-scheduler:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: runtime
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  # Shadow trading orchestration only — no exchange adapter, no API, no
  # dashboard, no real-money trading (docs/trading P5). Every flag that lets
  # it do anything at all defaults to false and is read exclusively from
  # .env.production; nothing here overrides that default, so a deployment
  # that never sets those flags starts this container fully idle.
  trading-worker:
    build:
      context: .
      dockerfile: apps/trading-worker/Dockerfile
      target: runtime
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "find /tmp/trading-worker-heartbeat -mmin -2 2>/dev/null | grep -q ."
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal

  # ── Ops (run on-demand, not started by default) ────────────────────────────

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    env_file:
      - path: .env.production
        required: false
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    profiles:
      - migration

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
